<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4f57"/>
      <stop offset="1" stop-color="#2b2f36"/>
    </linearGradient>
  </defs>

  <!-- The desktop the phone is mirrored onto -->
  <rect x="10" y="26" width="86" height="60" rx="7" fill="url(#body)"/>
  <rect x="16" y="32" width="74" height="48" rx="3" fill="#1c2026"/>
  <rect x="16" y="32" width="74" height="48" rx="3" fill="url(#screen)" opacity="0.35"/>
  <rect x="44" y="86" width="18" height="8" fill="url(#body)"/>
  <rect x="32" y="93" width="42" height="6" rx="3" fill="url(#body)"/>

  <!-- The phone itself, overlapping the screen -->
  <rect x="70" y="40" width="48" height="82" rx="10" fill="url(#body)"/>
  <rect x="74" y="44" width="40" height="74" rx="7" fill="#12151a"/>
  <rect x="74" y="44" width="40" height="74" rx="7" fill="url(#screen)"/>
  <circle cx="94" cy="50" r="2.4" fill="#12151a"/>
  <rect x="116.6" y="58" width="2.8" height="12" rx="1.4" fill="#5e636c"/>
  <rect x="116.6" y="74" width="2.8" height="20" rx="1.4" fill="#5e636c"/>

  <!-- Mirroring arc, phone to desktop -->
  <g fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" opacity="0.92">
    <path d="M62 68 a12 12 0 0 0 -12 -12"/>
    <path d="M62 68 a22 22 0 0 0 -22 -22"/>
  </g>
  <circle cx="62" cy="68" r="3.4" fill="#ffffff" opacity="0.92"/>
</svg>
